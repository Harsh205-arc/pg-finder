<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Login</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="../css/login.css">
</head>

<body>

  <!-- Navbar -->
  <header class="navbar">
    <h2>PBL-2 Project</h2>
    <a href="explore.html">Back</a>
  </header>

  <!-- Login Container -->
  <div class="login-container">
    <div class="login-box">

      <h2 id="form-title">Owner Login</h2>

      <form id="loginForm">

        <!-- Signup only fields -->
        <input type="text" name="name" placeholder="Full Name" class="signup-only" style="display:none;">
        <input type="text" name="phone" placeholder="Phone Number" class="signup-only" style="display:none;">

        <!-- Common fields -->
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">Login</button>

      </form>

      <p style="margin-top:10px;">
        Don't have an account?
        <a href="#" id="toggle-link">Sign Up</a>
      </p>

      <p id="msg"></p>

    </div>
  </div>

  <!-- JS -->
  <script src="../js/login.js"></script>

</body>

</html>
